<!DOCTYPE html>
<html>
<head>
    <title>SKU Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f9f9f9;
        }
        header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            background: #7b00ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #6fa0f6;
        }
        #output {
            margin-top: 1rem;
            font-weight: bold;
            color: #333;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>SKU Generator</h1>
    </header>

    <div class="container">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. Perishables">

        <label for="product">Product Name</label>
        <input type="text" id="product" placeholder="e.g. Bottled Water">

        <label for="quantity">Stock Quantity</label>
        <input type="number" id="quantity" placeholder="e.g. 50">

        <button py-click="generate_sku()">Generate SKU</button>

        <div id="output">Your generated SKU will appear here.</div>
    </div>

    <footer>
       <div class="footer">
		<p>SKU Generator — 1st Quarter Project </p>

	</div>
    </footer>
